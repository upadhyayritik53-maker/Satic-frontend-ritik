<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Notification Banner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Notification Banner -->
  <div id="notification" class="notification hidden">
    <span id="message"></span>
    <button class="close-btn" onclick="hideNotification()">×</button>
  </div>

  <!-- Cards -->
  <div class="card">
    <h3>Success Card</h3>
    <p>Show success notification banner.</p>
    <button class="btn success" onclick="showSuccess()">Show Success</button>
  </div>

  <div class="card">
    <h3>Error Card</h3>
    <p>Show error notification banner.</p>
    <button class="btn error" onclick="showError()">Show Error</button>
  </div>

<script src="script.js"></script>
</body>
</html>
