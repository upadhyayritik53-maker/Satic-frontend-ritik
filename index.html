<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Bar Component</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="search-container">
    <form id="searchForm">
      <input
        type="text"
        id="searchInput"
        placeholder="Search here..."
        aria-label="Search"
      />
      <button type="submit" aria-label="Search button">
        🔍
      </button>
    </form>
    <p id="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
